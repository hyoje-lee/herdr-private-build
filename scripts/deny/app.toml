# RustSec advisory check for herdr-app, run by secure_build.py on the patched sources.
# An advisory not listed in `ignore` stops the build until it is reviewed.
# cargo-deny warns when a listed advisory no longer matches; remove it then.
# Review notes: docs/source-audit.md#의존성-취약점-권고

[advisories]
ignore = [
    # Vulnerabilities in TLS behind gpui-shell's reqwest client, used for mod
    # fetch, WebSocket and image loading. These need a network capability, which
    # the private build denies to default mods; `herdr-app check` grants what a
    # folder's gpui-shell.json declares. Accepted; reachability not verified.
    { id = "RUSTSEC-2026-0285", reason = "rustls: mod network client only; accepted, see source-audit.md" },
    { id = "RUSTSEC-2026-0346", reason = "rustls: mod network client only; accepted, see source-audit.md" },
    { id = "RUSTSEC-2026-0348", reason = "rustls: mod network client only; accepted, see source-audit.md" },
    { id = "RUSTSEC-2026-0349", reason = "rustls: mod network client only; accepted, see source-audit.md" },
    { id = "RUSTSEC-2026-0382", reason = "rustls-webpki: mod network client only; accepted, see source-audit.md" },

    # Vulnerabilities in crypto and compression modules of the mod JS runtime
    # (quickjs-jit-stdlib, llrt), reached only when mod code calls them.
    # Accepted; reachability not verified.
    { id = "RUSTSEC-2023-0071", reason = "rsa timing side channel: mod JS crypto only; accepted, see source-audit.md" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint timing: mod JS crypto only; accepted, see source-audit.md" },
    { id = "RUSTSEC-2026-0385", reason = "ctutils timing: mod JS crypto only; accepted, see source-audit.md" },
    { id = "RUSTSEC-2026-0391", reason = "zstd context reuse: mod JS compression only; accepted, see source-audit.md" },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe seekable: mod JS compression only; accepted, see source-audit.md" },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe legacy frame: mod JS compression only; accepted, see source-audit.md" },
    { id = "RUSTSEC-2026-0410", reason = "zstd-sys WebAssembly allocator shim: not built for native Linux or Windows targets" },

    # Unmaintained crates without a known vulnerability.
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained (via syntect); no known vulnerability" },
    { id = "RUSTSEC-2024-0384", reason = "instant unmaintained (via notify-types); no known vulnerability" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained (via pulp); no known vulnerability" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained (via reqwest); no known vulnerability" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained (via usvg); no known vulnerability" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained (via fontdb and gpui); no known vulnerability" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained (via serde_yaml); no known vulnerability" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained (via zbus); no known vulnerability" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained (via zbus); no known vulnerability" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained (via zbus); no known vulnerability" },
]
